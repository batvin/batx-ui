services:
  batx-ui:
    build: .
    network_mode: host
    env_file:
      - .env
    environment:
      HOST: 127.0.0.1
      PORT: "8787"
      DATA_DIR: /app/data
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - batx_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    network_mode: host
    environment:
      BATX_DOMAIN: ${BATX_DOMAIN:-}
    command:
      - /bin/sh
      - -ec
      - 'test -n "$${BATX_DOMAIN:-}" || { echo "Set BATX_DOMAIN in .env before enabling HTTPS." >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - batx-ui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  batx_data:
  caddy_data:
  caddy_config:
